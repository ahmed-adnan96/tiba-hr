<!doctype html>
<html lang="ar" dir="rtl">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>منظومة الموارد البشرية | مركز طيبة التخصصي للعيون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
 </head>
 <body>
  <div id="login"><form class="box" id="loginForm">
  <h1>مركز طيبة التخصصي للعيون</h1><p>منظومة الموارد البشرية — تسجيل الدخول</p>
  <div class="field"><label for="lg_email">البريد الإلكتروني</label><input id="lg_email" type="email" autocomplete="username" required dir="ltr"></div>
  <div class="field"><label for="lg_pass">كلمة المرور</label><input id="lg_pass" type="password" autocomplete="current-password" required dir="ltr"></div>
  <button class="btn block" style="margin-top:14px" type="submit">دخول</button>
  <div class="err" id="lg_err" role="alert"></div>
</form></div>
<div id="banner"></div>
  <div id="app"></div>
  <div id="sheetRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/main.js"></script>
  <script type="module" src="js/firebase.js"></script>
 </body>
</html>
